<!DOCTYPE html>
<html lang="en" data-theme="corporate">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}EduTrace{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.24/dist/full.min.css" rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/charts.js"></script>
  <script defer src="/static/ux.js"></script>
</head>
<body class="bg-slate-100 text-slate-900">
  <header class="bg-slate-950 text-white">
    <div class="mx-auto max-w-7xl px-6 py-5">
      <h1 class="text-3xl font-bold">EduTrace</h1>
      <div class="mt-1 flex flex-wrap items-center justify-between gap-3">
        <p class="text-sm text-slate-300">Student marks analytics, trends, and AI-ready ingestion.</p>
        <label class="inline-flex items-center gap-2 text-xs text-slate-300">
          <span>Chart Theme</span>
          <select id="chart-variant-select" class="rounded-md border border-slate-700 bg-slate-900 px-2 py-1 text-xs text-white">
            <option value="academic">Academic</option>
            <option value="compare">Compare</option>
            <option value="warm">Warm</option>
          </select>
        </label>
      </div>
      <nav class="mt-4 flex flex-wrap gap-2 text-sm">
        <a href="/" class="nav-tab {% if request.url.path == '/' %}nav-tab-active{% else %}nav-tab-idle{% endif %}">Consolidated</a>
        <a href="/dashboards/target" class="nav-tab {% if request.url.path == '/dashboards/target' %}nav-tab-active{% else %}nav-tab-idle{% endif %}">Analyse Svanik's Progress</a>
        <a href="/dashboards/student-compare" class="nav-tab {% if request.url.path == '/dashboards/student-compare' %}nav-tab-active{% else %}nav-tab-idle{% endif %}">Drilldown Student Performance</a>
        <a href="/dashboards/approved-marks" class="nav-tab {% if request.url.path == '/dashboards/approved-marks' %}nav-tab-active{% else %}nav-tab-idle{% endif %}">Approved Marks</a>
        {% if is_admin %}
        <a href="/audit" class="nav-tab {% if request.url.path.startswith('/audit') %}nav-tab-active{% else %}nav-tab-idle{% endif %}">Audit</a>
        <a href="/admin" class="nav-tab {% if request.url.path == '/admin' %}nav-tab-active{% else %}nav-tab-idle{% endif %}">Admin</a>
        <a href="/admin/privacy" class="nav-tab {% if request.url.path.startswith('/admin/privacy') %}nav-tab-active{% else %}nav-tab-idle{% endif %}">Privacy</a>
        {% endif %}
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-7xl px-6 py-6">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
