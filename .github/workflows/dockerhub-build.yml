name: Build Push and Deploy EduTrace

on:
  push:
    branches:
      - initial-setup
  workflow_dispatch:

env:
  IMAGE_NAME: edutrace
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -t docker.io/praveensiva/edutrace:latest \
            .

      - name: Push image
        run: |
          docker push docker.io/praveensiva/edutrace:latest

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name edutrace \
            --resource-group rg-edutrace-free \
            --image docker.io/praveensiva/edutrace:latest